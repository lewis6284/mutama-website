name: Deploy MUTAMA WEBSITE via FTP

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.github/**
            **/README.md
            **/API_GUIDE.md
            **/CHANGELOG.md
            **/DATA_VERIFICATION.md
            **/DOCUMENTATION.md
            **/QUICK_API_GUIDE.md
            **/QUICK_START.md
            **/RESUME_FINAL.md
            **/VERIFICATION.md
            **/test-api.html
